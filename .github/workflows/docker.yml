name: Docker

on:
  push:
    tags:
      - "v*"

jobs:
  qualify-release:
    runs-on: ubuntu-latest
    env:
      MCP_VIEW_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view
      MCP_VIEW_CONTRACTS_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view-contracts
      MCP_VIEW_COMPONENTS_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view-components
    steps:
      - uses: actions/checkout@v5

      - name: Checkout the exact split mcp-view source
        uses: actions/checkout@v5
        with:
          repository: Casys-AI/mcp-server
          ref: 8fad891839203122efbe2438ba81a6e7d08c9202
          path: .deps/mcp-server
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2

      - name: Require tag to match package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match deno.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Verify release gates
        run: deno task release:check

      - name: Validate JSR publication
        run: deno publish --dry-run

  build-push:
    needs: qualify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build and load local release candidate
        run: docker buildx build --platform linux/amd64 --load --tag mcp-tolerance:release-smoke .

      - name: Smoke the local image stdio entry point
        run: |
          VERSION=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')
          deno run --allow-run scripts/smoke_stdio.ts --expect-version "$VERSION" -- \
            docker run --rm -i mcp-tolerance:release-smoke stdio

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/casys-ai/mcp-tolerance
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke the published image by immutable digest
        env:
          IMAGE: ghcr.io/casys-ai/mcp-tolerance
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          VERSION=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')
          deno run --allow-run scripts/smoke_stdio.ts --expect-version "$VERSION" -- \
            docker run --rm -i "$IMAGE@$DIGEST" stdio

      - name: Verify published index platforms and revision labels
        env:
          IMAGE: ghcr.io/casys-ai/mcp-tolerance
          DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          REF="$IMAGE@$DIGEST"
          INDEX=$(mktemp)
          docker buildx imagetools inspect "$REF" --raw > "$INDEX"
          jq -e '.mediaType == "application/vnd.oci.image.index.v1+json"' "$INDEX" > /dev/null

          {
            echo '### Published container verification'
            echo
            echo "- Immutable index: \`$REF\`"
            echo "- Source revision: \`$REVISION\`"
          } >> "$GITHUB_STEP_SUMMARY"

          for PLATFORM in linux/amd64 linux/arm64; do
            OS="${PLATFORM%/*}"
            ARCH="${PLATFORM#*/}"
            COUNT=$(jq --arg os "$OS" --arg arch "$ARCH" \
              '[.manifests[] | select(.platform.os == $os and .platform.architecture == $arch)] | length' \
              "$INDEX")
            if [ "$COUNT" -ne 1 ]; then
              echo "Expected exactly one $PLATFORM manifest in $REF, found $COUNT" >&2
              exit 1
            fi
            CHILD_DIGEST=$(jq -er --arg os "$OS" --arg arch "$ARCH" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest' \
              "$INDEX")
            CHILD=$(docker buildx imagetools inspect "$IMAGE@$CHILD_DIGEST" --format '{{json .}}')
            CHILD_REVISION=$(jq -er '.image.config.Labels["org.opencontainers.image.revision"]' <<< "$CHILD")
            if [ "$CHILD_REVISION" != "$REVISION" ]; then
              echo "$PLATFORM revision label is $CHILD_REVISION, expected $REVISION" >&2
              exit 1
            fi
            echo "- $PLATFORM: \`$IMAGE@$CHILD_DIGEST\` (revision label verified)" >> "$GITHUB_STEP_SUMMARY"
          done
