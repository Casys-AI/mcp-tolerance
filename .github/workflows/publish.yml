name: Publish

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MCP_VIEW_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view
      MCP_VIEW_CONTRACTS_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view-contracts
      MCP_VIEW_COMPONENTS_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view-components
    steps:
      - uses: actions/checkout@v5

      - name: Checkout the exact split mcp-view source
        uses: actions/checkout@v5
        with:
          repository: Casys-AI/mcp-server
          ref: 8fad891839203122efbe2438ba81a6e7d08c9202
          path: .deps/mcp-server
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2

      - name: Verify release gates
        run: deno task release:check

      - name: Validate JSR publication
        run: deno publish --dry-run

  publish-jsr:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # A push that does not bump the version must not turn the run red:
      # JSR versions are immutable, so "already published" is a no-op here,
      # not a failure.
      - name: Check whether this version is already on JSR
        id: version
        run: |
          NAME=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).name)')
          VER=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')
          BODY=$(curl -s "https://jsr.io/${NAME}/meta.json" || echo '{}')
          PUBLISHED=$(BODY="$BODY" VER="$VER" deno eval 'const m = JSON.parse(Deno.env.get("BODY") ?? "{}"); console.log((Deno.env.get("VER") ?? "") in (m.versions ?? {}))')
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "$NAME@$VER already on JSR: $PUBLISHED"

      - name: Publish to JSR
        if: steps.version.outputs.published != 'true'
        run: deno publish

  smoke-jsr:
    needs: publish-jsr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Smoke the published JSR stdio entry point
        run: |
          NAME=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).name)')
          VERSION=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')
          deno run --allow-run scripts/smoke_stdio.ts --expect-version "$VERSION" -- \
            deno run --minimum-dependency-age 0 --allow-all "jsr:${NAME}@${VERSION}/server" --stdio
